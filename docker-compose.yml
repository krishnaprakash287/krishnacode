version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexgen_postgres
    restart: always
    environment:
      POSTGRES_DB: nexgencode
      POSTGRES_USER: nexgen_user
      POSTGRES_PASSWORD: nexgen_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexgen_redis
    restart: always
    ports:
      - "6379:6379"

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: nexgen_piston
    restart: always
    ports:
      - "2000:2000"
    tmpfs:
      - /tmp

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexgen_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://nexgen_user:nexgen_password@postgres:5432/nexgencode
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=nexgencode_super_secret_jwt_key_2026
      - PISTON_URL=http://piston:2000
      - EXECUTION_MODE=PISTON
      - EMAIL_MODE=CONSOLE
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - piston

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexgen_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
